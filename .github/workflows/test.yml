name: bstr, bin & slice
on: [push, pull_request]
jobs:
  tests:
    name: Tests
    strategy:
      matrix:
        ocaml-version: [4.14, 5.0, 5.1, 5.2, 5.3, 5.4]
        operating-system: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          opam-local-packages: |
            *.opam
      - name: Install dependencies
        run: opam install --deps-only -t bstr bin slice
      - name: Build
        run: opam exec -- dune build -p bstr,bin,slice
      - name: Test
        run: opam exec -- dune runtest -p bstr,bin,slice
